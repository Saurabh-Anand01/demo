<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Name in Block</title>
  <style>
    .name-block {
      border: 2px solid black;   /* Border around the block */
      padding: 20px;             /* Space inside the block */
      width: fit-content;        /* Adjusts width to content */
      background-color: lightblue; /* Block color */
      font-size: 24px;           /* Text size */
      font-family: Arial, sans-serif; /* Font style */
    }
  </style>
</head>
<body>
  <div class="name-block">
    Saurabh Anand
  </div>
</body>
</html>
